plugins { id 'com.android.application' }
android {
    namespace 'com.lodoskent.watch'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lodoskent.watch'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-ble'
    }
    buildTypes {
        debug { debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}